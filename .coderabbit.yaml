language: "en-US"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "src/**"
    - "public/**"
    - "styles/**"
    - "tests/**"
    - "docs/**"
    - ".github/**"
    - ".env.example"
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    base_branches:
      - "main"
      - "dev"
      - "stage"
      - "prod"
chat:
  auto_reply: true
